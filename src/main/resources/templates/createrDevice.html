<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thêm Mới Thiết Bị - NNT Software</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { background-color: #f8f9fa; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

    /* --- SIDEBAR STYLES (Giữ nguyên) --- */
    #sidebar-wrapper { min-height: 100vh; margin-left: -15rem; transition: margin .25s ease-out; background-color: #0d6efd; width: 15rem; }
    #sidebar-wrapper .sidebar-heading { padding: 1.5rem 1.25rem; font-size: 1.2rem; font-weight: bold; color: white; border-bottom: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; }
    #sidebar-wrapper .list-group { width: 100%; }
    #sidebar-wrapper .list-group-item { background-color: #0d6efd; color: rgba(255,255,255,0.8); border: none; padding: 1rem 1.25rem; transition: all 0.2s; }
    #sidebar-wrapper .list-group-item:hover, #sidebar-wrapper .list-group-item.active { background-color: rgba(255,255,255,0.2); color: #fff; border-left: 4px solid white; font-weight: 600; padding-left: 1.5rem; }
    #page-content-wrapper { width: 100%; overflow-y: auto; height: 100vh; }
    @media (min-width: 768px) { #sidebar-wrapper { margin-left: 0; } body.sb-sidenav-toggled #sidebar-wrapper { margin-left: -15rem; } }

    /* --- FORM STYLES --- */
    .form-label { font-weight: 600; color: #495057; }
    .card { border: none; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05); border-radius: 10px; }
    .form-control:focus, .form-select:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15); }
  </style>
</head>
<body>

<div class="d-flex" id="wrapper">
  <!-- Sidebar -->
  <div class="border-end" id="sidebar-wrapper">
    <div class="sidebar-heading"><i class="fa-brands fa-nfc-symbol me-2"></i> NNT Software</div>
    <div class="list-group list-group-flush">
      <a href="/dashboardController" class="list-group-item list-group-item-action"><i class="fa-solid fa-house me-2"></i> Dashboard</a>
      <!-- Giữ trạng thái Active ở menu Thiết bị để người dùng biết họ đang ở mục nào -->
      <a href="/viewDevices" class="list-group-item list-group-item-action active"><i class="fa-solid fa-laptop me-2"></i> Thiết bị</a>
      <a href="/viewEmployees" class="list-group-item list-group-item-action"><i class="fa-solid fa-users me-2"></i> Người dùng</a>
      <a href="/viewChapters" class="list-group-item list-group-item-action"><i class="fa-solid fa-book me-2"></i> Chapter</a>
      <a href="/viewRequests" class="list-group-item list-group-item-action"><i class="fa-solid fa-clipboard-check me-2"></i> Yêu cầu</a>
      <a href="/logout" class="list-group-item list-group-item-action mt-auto border-top border-white-50"><i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất</a>
    </div>
  </div>

  <!-- Page Content -->
  <div id="page-content-wrapper">
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3 sticky-top">
      <div class="d-flex align-items-center">
        <button class="btn btn-primary d-md-none me-3" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <h2 class="fs-4 m-0 text-secondary">Thêm mới Thiết bị</h2>
      </div>
      <div class="ms-auto d-flex align-items-center">
        <span class="me-2 text-muted d-none d-md-block">Xin chào, <strong>Admin</strong></span>
        <div class="rounded-circle bg-secondary text-white d-flex justify-content-center align-items-center" style="width: 35px; height: 35px;">A</div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container-fluid px-4 py-4">
      <!-- Breadcrumb điều hướng -->
      <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/viewDevices" class="text-decoration-none">Danh sách thiết bị</a></li>
          <li class="breadcrumb-item active" aria-current="page">Thêm mới</li>
        </ol>
      </nav>

      <!-- Form Card -->
      <div class="row justify-content-center">
        <div class="col-xl-8 col-lg-10">
          <div class="card">
            <div class="card-header bg-white py-3 border-bottom-0">
              <h5 class="mb-0 text-primary"><i class="fa-solid fa-circle-plus me-2"></i>Thông tin thiết bị</h5>
            </div>
            <div class="card-body p-4">
              <!-- Form bắt đầu -->
              <form th:action="@{/saveDevice}" method="post" th:object="${device}">

                <div class="row g-4">
                  <!-- Tên thiết bị -->
                  <div class="col-md-6">
                    <label for="deviceName" class="form-label">Tên thiết bị <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="deviceName" name="name" placeholder="Ví dụ: Dell XPS 13" required>
                    <div class="form-text">Tên định danh hoặc mã tài sản.</div>
                  </div>

                  <!-- Loại thiết bị -->
                  <div class="col-md-6">
                    <label for="deviceType" class="form-label">Loại thiết bị <span class="text-danger">*</span></label>
                    <select class="form-select" id="deviceType" name="type" required>
                      <option value="" selected disabled>-- Chọn loại --</option>
                      <option value="Laptop">Laptop</option>
                      <option value="PC">PC (Máy bàn)</option>
                      <option value="Monitor">Màn hình</option>
                      <option value="Mouse">Chuột</option>
                      <option value="Keyboard">Bàn phím</option>
                      <option value="Printer">Máy in</option>
                      <option value="Other">Khác</option>
                    </select>
                  </div>

                  <!-- Trạng thái -->
                  <div class="col-md-6">
                    <label for="deviceStatus" class="form-label">Trạng thái ban đầu</label>
                    <select class="form-select" id="deviceStatus" name="status">
                      <option value="available" selected>Sẵn sàng (Available)</option>
                      <option value="maintenance">Đang bảo trì (Maintenance)</option>
                      <option value="broken">Hỏng (Broken)</option>
                    </select>
                  </div>

                  <!-- Người sử dụng (Optional) -->
                  <div class="col-md-6">
                    <label for="assignedUser" class="form-label">Người sử dụng (Nếu có)</label>
                    <select class="form-select" id="assignedUser" name="assignedUser">
                      <option value="" selected>-- Chưa cấp phát --</option>
                      <!-- Dùng Thymeleaf để load danh sách user từ DB -->
                      <!-- <option th:each="user : ${users}" th:value="${user.username}" th:text="${user.fullName}"></option> -->
                      <option value="NguyenVanA">Nguyễn Văn A (NV001)</option>
                      <option value="TranThiB">Trần Thị B (NV002)</option>
                    </select>
                  </div>

                  <!-- Ghi chú -->
                  <div class="col-12">
                    <label for="deviceNote" class="form-label">Ghi chú / Mô tả chi tiết</label>
                    <textarea class="form-control" id="deviceNote" name="note" rows="3" placeholder="Nhập cấu hình, tình trạng vật lý, số serial..."></textarea>
                  </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end mt-5 gap-2">
                  <a href="/viewDevices" class="btn btn-light border px-4">Hủy bỏ</a>
                  <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-save me-2"></i>Lưu thiết bị</button>
                </div>
              </form>
              <!-- Form kết thúc -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  var el = document.getElementById("wrapper");
  var toggleButton = document.getElementById("sidebarToggle");
  toggleButton.onclick = function () { el.classList.toggle("toggled"); };
</script>
</body>
</html>
