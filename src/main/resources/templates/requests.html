<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Duyệt Yêu Cầu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; overflow: hidden; }
   #sidebar-wrapper { min-height: 100vh; margin-left: -15rem; transition: margin .25s ease-out; background-color: #0d6efd; }
   #sidebar-wrapper .sidebar-heading { padding: 1.5rem 1.25rem; font-size: 1.2rem; font-weight: bold; color: white; border-bottom: 1px solid rgba(255,255,255,0.2); }
   #sidebar-wrapper .list-group { width: 15rem; }
   #sidebar-wrapper .list-group-item { background-color: #0d6efd; color: rgba(255,255,255,0.8); border: none; padding: 1rem 1.25rem; }
   #sidebar-wrapper .list-group-item:hover, #sidebar-wrapper .list-group-item.active { background-color: rgba(255,255,255,0.2); color: #fff; border-left: 4px solid white; font-weight: 600; }
   #page-content-wrapper { width: 100%; overflow-y: auto; height: 100vh; }
   @media (min-width: 768px) { #sidebar-wrapper { margin-left: 0; } body.sb-sidenav-toggled #sidebar-wrapper { margin-left: -15rem; } }
  </style>
</head>
<body>
<div class="d-flex" id="wrapper">
  <!-- Sidebar -->
  <div class="border-end" id="sidebar-wrapper">
    <div class="sidebar-heading"><i class="fa-brands fa-nfc-symbol me-2"></i>NNT Software</div>
    <div class="list-group list-group-flush">
      <a href="/dashboard" class="list-group-item list-group-item-action"><i class="fa-solid fa-house me-2"></i> Dashboard</a>
      <a href="/viewDevices" class="list-group-item list-group-item-action"><i class="fa-solid fa-laptop me-2"></i> Thiết bị</a>
      <a href="/viewEmployees" class="list-group-item list-group-item-action"><i class="fa-solid fa-users me-2"></i> Nhân viên</a>
      <a href="/viewDepartments" class="list-group-item list-group-item-action"><i class="fa-solid fa-building me-2"></i> Phòng ban</a>
      <a href="/viewRequests" class="list-group-item list-group-item-action active"><i class="fa-solid fa-clipboard-check me-2"></i> Yêu cầu</a>
      <a href="/logout" class="list-group-item list-group-item-action mt-auto border-top border-white-50"><i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất</a>
    </div>
  </div>

  <div id="page-content-wrapper">
    <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
      <h2 class="fs-4 m-0 text-secondary">Yêu cầu chờ duyệt</h2>
    </nav>

    <div class="container-fluid px-4 py-4">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
            <tr>
              <th class="ps-4 py-3 border-0">Người yêu cầu</th>
              <th class="py-3 border-0">Loại</th>
              <th class="py-3 border-0">Lý do / Chi tiết</th>
              <th class="py-3 border-0">Ngày tạo</th>
              <th class="py-3 border-0">Trạng thái</th>
              <th class="py-3 border-0 text-end pe-4">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="req : ${requests}">
              <td class="ps-4 fw-bold text-primary" th:text="${req.userName}">Nguyen Van A</td>
              <td th:text="${req.type}">Sửa chữa</td>
              <td class="text-muted" th:text="${req.reason}">Máy không lên nguồn</td>
              <td th:text="${req.createDate}">20/10/2023</td>
              <td><span class="badge bg-warning text-dark">Chờ duyệt</span></td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-success me-1"><i class="fa-solid fa-check"></i> Duyệt</button>
                <button class="btn btn-sm btn-danger"><i class="fa-solid fa-xmark"></i> Từ chối</button>
              </td>
            </tr>
            <!-- Static Mock Data -->
            <tr>
              <td class="ps-4 fw-bold text-primary">Trần Văn C</td>
              <td>Cấp mới</td>
              <td class="text-muted">Chuột Logitech MX Master 3</td>
              <td>21/11/2023</td>
              <td><span class="badge bg-warning text-dark">Chờ duyệt</span></td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-success me-1"><i class="fa-solid fa-check"></i></button>
                <button class="btn btn-sm btn-danger"><i class="fa-solid fa-xmark"></i></button>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
