<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách yêu cầu mượn thiết bị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fa; overflow: hidden; }
        #sidebar-wrapper { min-height: 100vh; margin-left: -15rem; transition: margin .25s ease-out; background-color: #0d6efd; }
        #sidebar-wrapper .sidebar-heading { padding: 1.5rem 1.25rem; font-size: 1.2rem; font-weight: bold; color: white; border-bottom: 1px solid rgba(255,255,255,0.2); }
        #sidebar-wrapper .list-group { width: 15rem; }
        #sidebar-wrapper .list-group-item { background-color: #0d6efd; color: rgba(255,255,255,0.8); border: none; padding: 1rem 1.25rem; }
        #sidebar-wrapper .list-group-item:hover, #sidebar-wrapper .list-group-item.active {
            background-color: rgba(255,255,255,0.2); color: #fff; border-left: 4px solid white; font-weight: 600;
        }
        #page-content-wrapper { width: 100%; overflow-y: auto; height: 100vh; }
        @media (min-width: 768px) { #sidebar-wrapper { margin-left: 0; } }
        .badge-action { cursor: pointer; padding: 8px 12px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div class="border-end" id="sidebar-wrapper">
        <div class="sidebar-heading"><i class="fa-brands fa-nfc-symbol me-2"></i>NNT Software</div>
        <div class="list-group list-group-flush">
            <a href="/dashboardController" class="list-group-item list-group-item-action">
                <i class="fa-solid fa-house me-2"></i> Dashboard
            </a>
            <a href="/viewDevices" class="list-group-item list-group-item-action">
                <i class="fa-solid fa-laptop me-2"></i> Thiết bị
            </a>
            <a href="/viewEmployees" class="list-group-item list-group-item-action">
                <i class="fa-solid fa-users me-2"></i> Nhân viên
            </a>
            <a href="/viewDepartments" class="list-group-item list-group-item-action">
                <i class="fa-solid fa-building me-2"></i> Phòng ban
            </a>
            <a href="/viewRequests" class="list-group-item list-group-item-action active">
                <i class="fa-solid fa-clipboard-check me-2"></i> Yêu cầu
            </a>
            <a href="/logout" class="list-group-item list-group-item-action mt-auto border-top border-white-50">
                <i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất
            </a>
        </div>
    </div>

    <!-- Main content -->
    <div id="page-content-wrapper">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
            <h2 class="fs-4 m-0 text-secondary">Danh sách yêu cầu mượn thiết bị</h2>
        </nav>

        <div class="container py-4">

            <div class="card border-0 shadow-sm">
                <div class="card-body">

                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Nhân viên</th>
                            <th>Loại thiết bị</th>
                            <th>Mô tả</th>
                            <th>Ngày tạo</th>
                            <th>Trạng thái</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="req : ${listRequest}">
                            <td th:text="${req.id}">1</td>
                            <td th:text="${req.userName}">Nguyễn Văn A</td>
                            <td th:text="${req.deviceType}">Laptop</td>
                            <td th:text="${req.description}">Làm dự án</td>
                            <td th:text="${req.createdAt}">2025-12-01</td>

                            <td>
                                <span class="badge bg-warning text-dark">Chờ duyệt</span>
                            </td>

                            <td class="text-end d-flex justify-content-end gap-2">
                                <form th:action="@{/admin/request/approve}" method="post">
                                    <input type="hidden" name="requestId" th:value="${req.id}">
                                    <button class="badge bg-success badge-action border-0">
                                        <i class="fa-solid fa-check me-1"></i> Duyệt
                                    </button>
                                </form>

                                <form th:action="@{/admin/request/reject}" method="post">
                                    <input type="hidden" name="requestId" th:value="${req.id}">
                                    <button class="badge bg-danger badge-action border-0">
                                        <i class="fa-solid fa-xmark me-1"></i> Từ chối
                                    </button>
                                </form>
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
