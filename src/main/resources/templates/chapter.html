<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quản Lý Phòng Ban</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; overflow: hidden; }
   #sidebar-wrapper { min-height: 100vh; margin-left: -15rem; transition: margin .25s ease-out; background-color: #0d6efd; }
   #sidebar-wrapper .sidebar-heading { padding: 1.5rem 1.25rem; font-size: 1.2rem; font-weight: bold; color: white; border-bottom: 1px solid rgba(255,255,255,0.2); }
   #sidebar-wrapper .list-group { width: 15rem; }
   #sidebar-wrapper .list-group-item { background-color: #0d6efd; color: rgba(255,255,255,0.8); border: none; padding: 1rem 1.25rem; }
   #sidebar-wrapper .list-group-item:hover, #sidebar-wrapper .list-group-item.active { background-color: rgba(255,255,255,0.2); color: #fff; border-left: 4px solid white; font-weight: 600; }
   #page-content-wrapper { width: 100%; overflow-y: auto; height: 100vh; }
   @media (min-width: 768px) { #sidebar-wrapper { margin-left: 0; } body.sb-sidenav-toggled #sidebar-wrapper { margin-left: -15rem; } }
  </style>
</head>
<body>
<div class="d-flex" id="wrapper">
  <!-- Sidebar -->
  <div class="border-end" id="sidebar-wrapper">
    <div class="sidebar-heading"><i class="fa-brands fa-nfc-symbol me-2"></i>NNT Software</div>
    <div class="list-group list-group-flush">
      <a href="/dashboard" class="list-group-item list-group-item-action"><i class="fa-solid fa-house me-2"></i> Dashboard</a>
      <a href="/viewDevices" class="list-group-item list-group-item-action"><i class="fa-solid fa-laptop me-2"></i> Thiết bị</a>
      <a href="/viewEmployees" class="list-group-item list-group-item-action"><i class="fa-solid fa-users me-2"></i> Nhân viên</a>
      <a href="/viewDepartments" class="list-group-item list-group-item-action active"><i class="fa-solid fa-building me-2"></i> Phòng ban</a>
      <a href="/viewRequests" class="list-group-item list-group-item-action"><i class="fa-solid fa-clipboard-check me-2"></i> Yêu cầu</a>
      <a href="/logout" class="list-group-item list-group-item-action mt-auto border-top border-white-50"><i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất</a>
    </div>
  </div>

  <div id="page-content-wrapper">
    <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
      <h2 class="fs-4 m-0 text-secondary">Cơ cấu Phòng ban</h2>
    </nav>

    <div class="container-fluid px-4 py-4">
      <div class="d-flex justify-content-end mb-4">
        <button class="btn btn-success"><i class="fa-solid fa-plus me-1"></i> Tạo phòng ban</button>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
            <tr>
              <th class="ps-4 py-3 border-0">Tên Phòng Ban</th>
              <th class="py-3 border-0">Trưởng Phòng</th>
              <th class="py-3 border-0">Số lượng nhân sự</th>
              <th class="py-3 border-0">Vị trí</th>
              <th class="py-3 border-0 text-end pe-4">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dept : ${departments}">
              <td class="ps-4 fw-semibold" th:text="${dept.name}">Phòng Kỹ Thuật</td>
              <td th:text="${dept.managerName}">Nguyen Van A</td>
              <td><span class="badge rounded-pill bg-secondary" th:text="${dept.employeeCount}">12</span></td>
              <td class="text-muted" th:text="${dept.location}">Tầng 3</td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-primary me-1"><i class="fa-solid fa-pen"></i></button>
                <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
            <!-- Static Mock Data -->
            <tr>
              <td class="ps-4 fw-semibold">Phòng Marketing</td>
              <td>Trần Thị B</td>
              <td><span class="badge rounded-pill bg-secondary">8</span></td>
              <td class="text-muted">Tầng 3, Tòa A</td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-primary me-1"><i class="fa-solid fa-pen"></i></button>
                <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
