<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <style>
    /* Đặt các font chữ cơ bản và reset margin */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    /* Container chính chứa 2 cột */
    .login-container {
        display: flex;
        width: 900px;
        height: 600px;
        background-color: #ffffff;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        overflow: hidden; /* Đảm bảo các góc bo tròn */
    }

    /* Cột bên trái chứa form */
    .login-form-wrapper {
        flex: 1; /* Chiếm 1 phần */
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Cột bên phải chứa ảnh */
    .login-image-wrapper {
        flex: 1.5; /* Chiếm 1.5 phần (lớn hơn) */
        background-color: #333;
        overflow: hidden;
    }

    .login-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Đảm bảo ảnh lấp đầy mà không bị méo */
    }

    /* Định dạng các thành phần trong form */
    .login-form h2 {
        color: #D32F2F; /* Màu đỏ như trong ảnh */
        font-size: 2.5rem;
        font-weight: 500;
        margin-bottom: 5px;
    }

    .login-form p {
        font-size: 1rem;
        color: #555;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        color: #D32F2F; /* Màu đỏ */
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .form-group input {
        width: 100%;
        padding: 12px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box; /* Quan trọng để padding không làm vỡ layout */
        font-size: 1rem;
    }

    .btn-signin {
        width: 100%;
        padding: 12px;
        background-color: #D7B0B0; /* Màu nút mờ như trong ảnh */
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .btn-signin:hover {
        background-color: #C08E8E; /* Màu đậm hơn khi hover */
    }
  </style>
</head>
<body>

<div class="login-container">

  <div class="login-form-wrapper">
    <div class="login-form">
      <h2>Login</h2>
      <p>Login to your account.</p>

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="username">E-mail Address or Username</label>

          <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-signin">Sign In</button>
      </form>
    </div>
  </div>

  <div class="login-image-wrapper">
    <img src="https://i.imgur.com/gFeGGb4.png" alt="Login Image">
  </div>

</div>

</body>
</html>
