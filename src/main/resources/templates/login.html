<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - NNT Software</title>
  <style>
    /* CSS Cơ bản */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-container {
        display: flex;
        width: 900px;
        height: 600px;
        background-color: #ffffff;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        overflow: hidden;
    }

    .login-form-wrapper {
        flex: 1;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-image-wrapper {
        flex: 1.5;
        background-color: #333;
        overflow: hidden;
    }

    .login-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .login-form h2 {
        color: #D32F2F;
        font-size: 2.5rem;
        font-weight: 500;
        margin-bottom: 5px;
    }

    .login-form p {
        font-size: 1rem;
        color: #555;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        color: #D32F2F;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .form-group input {
        width: 100%;
        padding: 12px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 1rem;
    }

    .btn-signin {
        width: 100%;
        padding: 12px;
        background-color: #D7B0B0;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .btn-signin:hover {
        background-color: #C08E8E;
    }

    /* CSS cho thông báo lỗi */
    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 20px;
        text-align: center;
        border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

<div class="login-container">

  <div class="login-form-wrapper">
    <div class="login-form">
      <h2>Login</h2>
      <p>Login to your account.</p>

      <div th:if="${param.error}" class="alert-error">
        <span style="font-weight: bold;">⚠️ Đăng nhập thất bại!</span><br>
        Sai tên đăng nhập hoặc mật khẩu.
      </div>

      <form th:action="@{/login}" method="POST" th:object="${user}">
        <div class="form-group">
          <label for="username">E-mail Address or Username</label>
          <input type="text" id="username" th:field="*{username}" required placeholder="admin">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" th:field="*{password}" required placeholder="123456">
        </div>

        <button type="submit" class="btn-signin">Sign In</button>

        <div style="margin-top: 15px; text-align: center;">
          <a href="/viewRegister" style="color: #555; text-decoration: none;">Create an account</a>
        </div>
      </form>
    </div>
  </div>

  <div class="login-image-wrapper">
    <img src="https://i.imgur.com/gFeGGb4.png" alt="Login Image">
  </div>

</div>

</body>
</html>
